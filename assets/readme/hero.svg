<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">LLM E-Ink Dashboard</title>
  <desc id="hero-desc">本地 LLM 用量数据经由 macOS 应用，安全地显示在三色电子墨水屏上。</desc>
  <defs>
    <style>
      .k{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.muted{fill:#7a8278}.ink{fill:#1d201e}.line{stroke:#b9c1b5;stroke-width:2}.lime{fill:#d4ff63}.paper{fill:#f9faf6}.red{fill:#d84932}.small{font-size:21px}.label{font-size:24px;font-weight:600}.title{font-size:66px;font-weight:700}
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#1d201e" flood-opacity=".14"/></filter>
  </defs>
  <rect width="1200" height="500" rx="18" fill="#eef0eb"/>
  <path d="M74 56H80V84H74zM74 96H80V124H74zM74 136H80V164H74z" fill="#d4ff63"/>
