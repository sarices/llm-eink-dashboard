<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="flow-title flow-desc">
  <title id="flow-title">同步与推送流程</title>
  <desc id="flow-desc">用户或计划任务触发同步，应用读取数据源和 Keychain 凭据，拉取用量、保存快照、渲染三色图像，扫描或重连电子墨水屏，CRC 传输并刷新后断开连接。</desc>
  <defs><style>.k{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.title{font-size:28px;font-weight:700}.meta{font-size:18px}.step{font-size:21px;font-weight:700}.detail{font-size:18px}.ink{fill:#1d201e}.muted{fill:#687266}.card{fill:#f9faf6;stroke:#c2c9bd;stroke-width:2}.lime{fill:#d4ff63}.red{fill:#d84932}.wire{fill:none;stroke:#7a8278;stroke-width:2.5}</style><marker id="flow-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7a8278"/></marker></defs>
  <rect width="1200" height="600" rx="18" fill="#eef0eb"/>
  <text x="56" y="66" class="k title ink">同步与推送流程</text><text x="56" y="98" class="k m meta muted">MANUAL SYNC · SCHEDULED SYNC · AUTO RECONNECT</text>
  <g transform="translate(60 164)"><rect width="188" height="142" rx="9" class="card"/><rect width="188" height="10" rx="9" class="lime"/><text x="22" y="52" class="k step ink">01 触发同步</text><text x="22" y="82" class="k m detail muted">立即同步</text><text x="22" y="109" class="k m detail muted">或计划任务</text></g>
  <g transform="translate(292 164)"><rect width="188" height="142" rx="9" class="card"/><text x="22" y="52" class="k step ink">02 读取凭据</text><text x="22" y="82" class="k m detail muted">选择数据源</text><text x="22" y="109" class="k m detail muted">Keychain 运行时读取</text></g>
  <g transform="translate(524 164)"><rect width="188" height="142" rx="9" class="card"/><text x="22" y="52" class="k step ink">03 查询数据</text><text x="22" y="82" class="k m detail muted">余额 / 今日 / 本月</text><text x="22" y="109" class="k m detail muted">本地自然日与自然月</text></g>
  <g transform="translate(756 164)"><rect width="188" height="142" rx="9" class="card"/><text x="22" y="52" class="k step ink">04 记录与渲染</text><text x="22" y="82" class="k m detail muted">快照 · 日志</text><text x="22" y="109" class="k m detail muted">三色 EPD 位图</text></g>
  <g transform="translate(987 164)"><rect width="158" height="142" rx="9" class="ink"/><text x="20" y="52" class="k step" fill="#f9faf6">05 连接设备</text><text x="20" y="82" class="k m detail" fill="#bfc8b9">持续扫描</text><text x="20" y="109" class="k m detail" fill="#bfc8b9">重连上次设备</text></g>
  <path d="M248 235H292M480 235H524M712 235H756M944 235H987" class="wire" marker-end="url(#flow-arrow)"/>
  <path d="M1066 306V379H922" class="wire" marker-end="url(#flow-arrow)"/>
  <g transform="translate(666 380)"><rect width="256" height="142" rx="9" class="card"/><rect width="256" height="10" rx="9" class="red"/><text x="22" y="52" class="k step ink">06 可靠传输</text><text x="22" y="82" class="k m detail muted">INIT + CRC 分块</text><text x="22" y="109" class="k m detail muted">状态位图 · 最多三轮重传</text></g>
  <path d="M666 451H492" class="wire" marker-end="url(#flow-arrow)"/>
  <g transform="translate(236 380)"><rect width="256" height="142" rx="9" class="card"/><text x="22" y="52" class="k step ink">07 刷新并结束</text><text x="22" y="82" class="k m detail muted">REFRESH · 更新概览</text><text x="22" y="109" class="k m detail muted">Toast · 断开设备</text></g>
  <text x="60" y="560" class="k m meta muted">失败路径：保留可分页日志；设备重新进入广播后可再次发现和推送。</text>
</svg>
