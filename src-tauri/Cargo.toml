[package]
name = "llm-eink-dashboard"
version = "0.1.4"
description = "A private LLM usage dashboard for E-Ink displays"
edition = "2021"

[lib]
name = "llm_eink_dashboard_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "llm-eink-dashboard"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
anyhow = "1.0.95"
async-trait = "0.1.85"
base64 = "0.22.1"
btleplug = "0.11.8"
chrono = { version = "0.4.39", features = ["serde"] }
crc = "3.2.1"
futures = "0.3.31"
parking_lot = "0.12.3"
keyring = { version = "3.6.1", features = ["apple-native"] }
regex = "1.11.1"
reqwest = { version = "0.12.12", default-features = false, features = ["json", "rustls-tls"] }
rust_decimal = { version = "1.36.0", features = ["serde"] }
rusqlite = { version = "0.32.1", features = ["bundled", "chrono"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"
tauri = { version = "2.9.1", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.5.0"
tauri-plugin-opener = "2.5.2"
tokio = { version = "1.43.0", features = ["process", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1.11.0", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.15.0"
